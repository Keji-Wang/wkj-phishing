<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HZLT PHISHHUNT - 钓鱼邮件找茬训练</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   DESIGN SYSTEM — Phishing Challenge Trainer
   Aesthetic: Cyber-noir SOC terminal × refined email client
   ═══════════════════════════════════════════════════════════ */

:root {
  /* Surface */
  --bg-deep: #0a0c10;
  --bg-base: #0f1218;
  --bg-raised: #161b24;
  --bg-card: #1a1f2b;
  --bg-hover: #222938;
  --bg-active: #2a3345;

  /* Text */
  --text-primary: #e8ecf1;
  --text-secondary: #8893a7;
  --text-muted: #505a6e;
  --text-inverse: #0a0c10;

  /* Accent */
  --amber: #f0a030;
  --amber-dim: #b87a20;
  --amber-glow: rgba(240,160,48,0.15);
  --amber-bright: #ffc048;

  /* Semantic */
  --red: #f04848;
  --red-dim: #c03030;
  --red-glow: rgba(240,72,72,0.12);
  --green: #40c870;
  --green-dim: #289050;
  --green-glow: rgba(64,200,112,0.12);
  --blue: #4890f0;

  /* Border */
  --border: #1e2530;
  --border-light: #2a3345;

  /* Radius */
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  --r-xl: 20px;

  /* Typography */
  --font-display: 'JetBrains Mono', monospace;
  --font-body: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;

  /* Score grades */
  --grade-s: #ffc048;
  --grade-a: #40c870;
  --grade-b: #4890f0;
  --grade-c: #f0a030;
  --grade-d: #f04848;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { font-size: 15px; }

body {
  font-family: var(--font-body);
  background: var(--bg-deep);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* Background texture */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 50% at 20% 0%, rgba(240,160,48,0.04) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 100%, rgba(72,144,240,0.03) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}

/* Noise overlay */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  opacity: 0.025;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
}

/* ─── Scrolling ─── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ─── Header ─── */
.header {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 56px;
  background: rgba(15,18,24,0.85);
  backdrop-filter: blur(16px) saturate(180%);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  z-index: 100;
}

.header-logo {
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.5px;
  cursor: pointer;
}

.logo-img {
  width: 32px;
  height: 32px;
  object-fit: contain;
}

.logo-text {
  display: flex;
  align-items: center;
  gap: 2px;
}

.logo-hzlt { color: #4a90e2; }
.logo-phish { color: #ffffff; }
.logo-hunt { color: #f0a030; }

.header-logo .shield {
  width: 28px;
  height: 28px;
  background: linear-gradient(135deg, var(--amber) 0%, var(--amber-dim) 100%);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  color: var(--bg-deep);
  font-weight: 700;
}

.header-progress {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 0 40px;
}

.progress-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--border-light);
  transition: all 0.3s;
}

.progress-dot.active {
  background: var(--amber);
  box-shadow: 0 0 8px var(--amber-glow);
}

.progress-dot.done-correct {
  background: var(--green);
}

.progress-dot.done-wrong {
  background: var(--red);
}

.header-stats {
  display: flex;
  align-items: center;
  gap: 16px;
  font-family: var(--font-display);
  font-size: 12px;
  color: var(--text-secondary);
}

.stat-val {
  color: var(--amber);
  font-weight: 600;
}

/* ─── Views Container ─── */
.views {
  position: relative;
  z-index: 1;
  padding-top: 56px;
  min-height: 100vh;
}

.view {
  display: none;
  animation: viewIn 0.5s cubic-bezier(0.16,1,0.3,1) forwards;
}

.view.active { display: block; }

@keyframes viewIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ═══════════════════════════════════════════════════════════
   LANDING VIEW
   ═══════════════════════════════════════════════════════════ */

.landing {
  max-width: 1100px;
  margin: 0 auto;
  padding: 60px 24px 80px;
}

.landing-hero {
  text-align: center;
  margin-bottom: 56px;
}

.landing-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  background: var(--amber-glow);
  border: 1px solid rgba(240,160,48,0.2);
  border-radius: 20px;
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 600;
  color: var(--amber);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 24px;
}

.landing-title {
  font-family: var(--font-display);
  font-size: clamp(28px, 4vw, 44px);
  font-weight: 700;
  line-height: 1.2;
  margin-bottom: 16px;
  background: linear-gradient(135deg, var(--text-primary) 30%, var(--amber) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.landing-subtitle {
  font-size: 16px;
  color: var(--text-secondary);
  max-width: 600px;
  margin: 0 auto 32px;
  line-height: 1.7;
}

.landing-features {
  display: flex;
  justify-content: center;
  gap: 32px;
  flex-wrap: wrap;
  margin-bottom: 48px;
}

.feature-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text-secondary);
}

.feature-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--amber);
}

/* Scenario Cards */
.section-label {
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 20px;
  padding-left: 2px;
}

.scenario-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 16px;
}

.scenario-card {
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 24px;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.16,1,0.3,1);
  position: relative;
  overflow: hidden;
}

.scenario-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--card-accent, var(--amber));
  opacity: 0;
  transition: opacity 0.25s;
}

.scenario-card:hover {
  border-color: var(--border-light);
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}

.scenario-card:hover::before { opacity: 1; }

.scenario-icon {
  width: 40px;
  height: 40px;
  border-radius: var(--r-md);
  background: var(--amber-glow);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  margin-bottom: 16px;
}

.scenario-card[data-scenario="urgency"] { --card-accent: #f04848; }
.scenario-card[data-scenario="urgency"] .scenario-icon { background: rgba(240,72,72,0.1); }

.scenario-card[data-scenario="impersonation"] { --card-accent: #4890f0; }
.scenario-card[data-scenario="impersonation"] .scenario-icon { background: rgba(72,144,240,0.1); }

.scenario-card[data-scenario="financial"] { --card-accent: #f0a030; }
.scenario-card[data-scenario="financial"] .scenario-icon { background: rgba(240,160,48,0.1); }

.scenario-card[data-scenario="techsupport"] { --card-accent: #40c870; }
.scenario-card[data-scenario="techsupport"] .scenario-icon { background: rgba(64,200,112,0.1); }

.scenario-card[data-scenario="delivery"] { --card-accent: #a078f0; }
.scenario-card[data-scenario="delivery"] .scenario-icon { background: rgba(160,120,240,0.1); }

.scenario-card[data-scenario="data"] { --card-accent: #f06090; }
.scenario-card[data-scenario="data"] .scenario-icon { background: rgba(240,96,144,0.1); }

.scenario-name {
  font-weight: 600;
  font-size: 15px;
  margin-bottom: 6px;
  color: var(--text-primary);
}

.scenario-desc {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.5;
  margin-bottom: 16px;
}

.scenario-meta {
  display: flex;
  align-items: center;
  gap: 16px;
  font-size: 12px;
  color: var(--text-muted);
  font-family: var(--font-display);
}

.scenario-count { color: var(--amber); font-weight: 600; }

/* Start All Button */
.landing-actions {
  display: flex;
  justify-content: center;
  gap: 16px;
  margin-top: 40px;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 28px;
  border: none;
  border-radius: var(--r-md);
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
}

.btn-primary {
  background: var(--amber);
  color: var(--bg-deep);
}

.btn-primary:hover {
  background: var(--amber-bright);
  transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(240,160,48,0.3);
}

.btn-ghost {
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid var(--border-light);
}

.btn-ghost:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
  border-color: var(--text-muted);
}

.btn-sm {
  padding: 8px 16px;
  font-size: 13px;
}

/* ═══════════════════════════════════════════════════════════
   PRACTICE VIEW — Email Client
   ═══════════════════════════════════════════════════════════ */

.practice {
  display: flex;
  height: calc(100vh - 56px);
  gap: 0;
}

/* Email panel */
.email-panel {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  display: flex;
  justify-content: center;
}

.email-container {
  width: 100%;
  max-width: 680px;
}

/* Email client chrome */
.email-client {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  overflow: hidden;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.02),
    0 8px 40px rgba(0,0,0,0.4);
}

.email-toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 16px;
  background: var(--bg-raised);
  border-bottom: 1px solid var(--border);
}

.toolbar-btn {
  width: 32px;
  height: 32px;
  border-radius: var(--r-sm);
  border: none;
  background: transparent;
  color: var(--text-muted);
  font-size: 15px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}

.toolbar-btn:hover {
  background: var(--bg-hover);
  color: var(--text-secondary);
}

.toolbar-sep {
  width: 1px;
  height: 20px;
  background: var(--border);
  margin: 0 4px;
}

/* Email header */
.email-header {
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--border);
}

.email-subject {
  font-size: 18px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 16px;
  line-height: 1.4;
}

.email-meta-row {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 8px;
}

.email-meta-label {
  font-size: 12px;
  color: var(--text-muted);
  min-width: 40px;
  padding-top: 2px;
  flex-shrink: 0;
}

.email-meta-value {
  font-size: 13px;
  color: var(--text-secondary);
}

.email-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--amber-dim), var(--amber));
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 14px;
  color: var(--bg-deep);
  flex-shrink: 0;
}

.email-sender-info {
  flex: 1;
}

.email-sender-name {
  font-weight: 600;
  font-size: 14px;
  color: var(--text-primary);
}

.email-sender-addr {
  font-family: var(--font-display);
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 2px;
}

.email-date {
  font-size: 12px;
  color: var(--text-muted);
  flex-shrink: 0;
}

/* Email body */
.email-body {
  padding: 24px;
  font-size: 14px;
  line-height: 1.8;
  color: var(--text-primary);
}

.email-body p { margin-bottom: 14px; }
.email-body p:last-child { margin-bottom: 0; }

.email-greeting {
  font-weight: 500;
  margin-bottom: 16px !important;
}

/* Email attachments */
.email-attachments {
  padding: 0 24px 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.attachment {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  font-size: 13px;
  color: var(--text-secondary);
  cursor: default;
}

.attachment .icon { font-size: 16px; }

/* Email footer */
.email-footer {
  padding: 16px 24px;
  border-top: 1px solid var(--border);
  background: var(--bg-raised);
  display: flex;
  align-items: center;
  gap: 8px;
}

.footer-btn {
  padding: 8px 16px;
  border-radius: var(--r-sm);
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-secondary);
  font-size: 13px;
  font-family: var(--font-body);
  cursor: pointer;
  transition: all 0.15s;
}

.footer-btn:hover {
  background: var(--bg-hover);
  border-color: var(--border-light);
}

/* ─── Risk Points — the core interactive elements ─── */
.risk-point {
  position: relative;
  cursor: text;
  padding-bottom: 1px;
  transition: all 0.2s;
  border-radius: 2px;
}

/* Subtle hint on hover - this is when you discover it's clickable */
.risk-point:hover {
  cursor: pointer;
  border-bottom: 2px dashed var(--red-dim);
  background: rgba(240,72,72,0.08);
}

.risk-point.selected {
  border-bottom: 2px solid var(--red);
  background: rgba(240,72,72,0.15);
  border-radius: 3px;
}

.risk-point.selected::after {
  content: '✓';
  position: absolute;
  top: -8px;
  right: -8px;
  width: 18px;
  height: 18px;
  background: var(--red);
  color: white;
  border-radius: 50%;
  font-size: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  animation: checkPop 0.3s cubic-bezier(0.34,1.56,0.64,1);
}

@keyframes checkPop {
  from { transform: scale(0); }
  to { transform: scale(1); }
}

/* Results state risk points */
.risk-point.result-correct {
  border-bottom: 2px solid var(--green);
  background: var(--green-glow);
  cursor: default;
}

.risk-point.result-correct::after {
  content: '✓';
  position: absolute;
  top: -8px;
  right: -8px;
  width: 18px;
  height: 18px;
  background: var(--green);
  color: white;
  border-radius: 50%;
  font-size: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
}

.risk-point.result-missed {
  border-bottom: 2px solid var(--red);
  background: rgba(240,72,72,0.1);
  cursor: default;
  animation: missedPulse 1.5s ease-in-out 2;
}

@keyframes missedPulse {
  0%, 100% { background: rgba(240,72,72,0.1); }
  50% { background: rgba(240,72,72,0.2); }
}

.risk-point.result-missed::after {
  content: '✗';
  position: absolute;
  top: -8px;
  right: -8px;
  width: 18px;
  height: 18px;
  background: var(--red);
  color: white;
  border-radius: 50%;
  font-size: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
}

.risk-point.result-false {
  border-bottom: 2px dashed var(--text-muted);
  background: rgba(80,90,110,0.1);
  cursor: default;
}

/* Email CTA button (also clickable if it's a risk point) */
.email-cta {
  display: inline-block;
  padding: 10px 28px;
  background: var(--amber);
  color: var(--bg-deep);
  font-weight: 600;
  font-size: 14px;
  border-radius: var(--r-sm);
  text-decoration: none;
  margin: 12px 0;
  transition: all 0.2s;
}

.email-cta.risk-point {
  cursor: pointer;
}

.email-cta.risk-point:hover {
  background: var(--amber-bright);
  transform: translateY(-1px);
}

.email-cta.risk-point.selected {
  background: var(--red);
  color: white;
  box-shadow: 0 0 0 3px rgba(240,72,72,0.3);
}

.email-link {
  color: var(--blue);
  text-decoration: underline;
  cursor: pointer;
  transition: all 0.15s;
}

.email-link.risk-point {
  border-bottom: none;
  text-decoration-color: var(--red-dim);
  text-decoration-style: wavy;
}

.email-link.risk-point.selected {
  text-decoration-color: var(--red);
  background: rgba(240,72,72,0.1);
  border-radius: 2px;
}

/* ─── Side Panel ─── */
.side-panel {
  width: 380px;
  min-width: 380px;
  background: var(--bg-base);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}

.panel-section {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
}

.panel-section:last-child { border-bottom: none; }

.panel-label {
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 14px;
}

/* Scenario & difficulty tags */
.email-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
}

.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  font-family: var(--font-display);
  letter-spacing: 0.5px;
}

.tag-scenario {
  background: var(--amber-glow);
  color: var(--amber);
  border: 1px solid rgba(240,160,48,0.2);
}

.tag-diff {
  background: rgba(72,144,240,0.1);
  color: var(--blue);
  border: 1px solid rgba(72,144,240,0.2);
}

/* Instruction box */
.instruction-box {
  padding: 14px 16px;
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  margin-bottom: 12px;
}

.instruction-box .icon { margin-right: 6px; }

.instruction-text {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.6;
}

.instruction-text strong { color: var(--amber); font-weight: 600; }

/* Selected items list */
.selected-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.selected-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  font-size: 13px;
  color: var(--text-primary);
  animation: slideIn 0.2s ease-out;
}

@keyframes slideIn {
  from { opacity: 0; transform: translateX(10px); }
  to { opacity: 1; transform: translateX(0); }
}

.selected-item .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--red);
  flex-shrink: 0;
}

.selected-item .remove {
  margin-left: auto;
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 14px;
  padding: 2px;
  line-height: 1;
  transition: color 0.15s;
}

.selected-item .remove:hover { color: var(--red); }

.empty-hint {
  font-size: 13px;
  color: var(--text-muted);
  font-style: italic;
  padding: 8px 0;
}

/* Action buttons */
.panel-actions {
  padding: 20px 24px;
  border-top: 1px solid var(--border);
  background: var(--bg-base);
  margin-top: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  position: sticky;
  bottom: 0;
}

.btn-submit {
  background: var(--red);
  color: white;
  width: 100%;
  justify-content: center;
  padding: 14px;
  font-size: 15px;
  border: none;
  border-radius: var(--r-md);
  font-family: var(--font-body);
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}

.btn-submit:hover {
  background: #ff5050;
  box-shadow: 0 4px 20px rgba(240,72,72,0.3);
}

.btn-submit:disabled {
  background: var(--bg-hover);
  color: var(--text-muted);
  cursor: not-allowed;
  box-shadow: none;
}

.btn-skip, .btn-next {
  width: 100%;
  justify-content: center;
  padding: 12px;
  font-size: 14px;
}

.result-score-section {
  text-align: center;
  padding: 28px 24px;
  border-bottom: 1px solid var(--border);
}

.score-circle {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  margin: 0 auto 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
}

.score-circle::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 3px solid var(--border);
}

.score-circle.grade-s::before { border-color: var(--grade-s); box-shadow: 0 0 20px rgba(255,192,72,0.2); }
.score-circle.grade-a::before { border-color: var(--grade-a); box-shadow: 0 0 20px rgba(64,200,112,0.2); }
.score-circle.grade-b::before { border-color: var(--grade-b); }
.score-circle.grade-c::before { border-color: var(--grade-c); }
.score-circle.grade-d::before { border-color: var(--grade-d); box-shadow: 0 0 20px rgba(240,72,72,0.2); }

.score-num {
  font-family: var(--font-display);
  font-size: 32px;
  font-weight: 700;
  line-height: 1;
}

.score-label {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
}

.score-grade {
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 2px;
  margin-bottom: 4px;
}

.score-message {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.5;
}

/* Result stats bar */
.result-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
}

.result-stat {
  text-align: center;
  padding: 10px 8px;
  background: var(--bg-raised);
  border-radius: var(--r-sm);
}

.result-stat-num {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 4px;
}

.result-stat-label {
  font-size: 11px;
  color: var(--text-muted);
}

.stat-correct .result-stat-num { color: var(--green); }
.stat-missed .result-stat-num { color: var(--red); }
.stat-false .result-stat-num { color: var(--text-muted); }

/* Risk breakdown */
.risk-breakdown {
  padding: 16px 24px;
}

.risk-card {
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 16px;
  margin-bottom: 10px;
  animation: fadeIn 0.4s ease-out backwards;
}

.risk-card:nth-child(1) { animation-delay: 0.1s; }
.risk-card:nth-child(2) { animation-delay: 0.2s; }
.risk-card:nth-child(3) { animation-delay: 0.3s; }
.risk-card:nth-child(4) { animation-delay: 0.4s; }
.risk-card:nth-child(5) { animation-delay: 0.5s; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.risk-card-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}

.risk-status {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}

.risk-status.hit { background: var(--green); color: white; }
.risk-status.miss { background: var(--red); color: white; }

.risk-card-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
}

.risk-card-body {
  font-size: 13px;
  line-height: 1.7;
  color: var(--text-secondary);
}

.risk-card-body strong { color: var(--text-primary); font-weight: 600; }

.risk-explanation {
  margin-top: 10px;
  padding: 12px;
  background: var(--bg-card);
  border-left: 3px solid var(--red-dim);
  border-radius: 0 var(--r-sm) var(--r-sm) 0;
}

.risk-explanation.correct-action {
  border-left-color: var(--green-dim);
}

.risk-explanation-label {
  font-family: var(--font-display);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 6px;
}

.risk-explanation-text {
  font-size: 13px;
  line-height: 1.6;
  color: var(--text-secondary);
}

/* ═══════════════════════════════════════════════════════════

   ═══════════════════════════════════════════════════════════ */

.complete {

      { id: 'e006-r3', label: '模糊的泄露来源', severity: 'medium',
        explanation: '"某大型招聘平台"故意不指明具体平台名称，这样无论哪个招聘平台泄露数据，你都会觉得"说的可能是真的"。',
        correctAction: '真正的安全通知会明确告知泄露的具体来源和你的具体受影响账户。' },
      { id: 'e006-r4', label: '提及"密码哈希"制造恐慌', severity: 'high',
        explanation: '"密码哈希"听起来技术性很强且威胁很大，但普通用户不清楚哈希与明文密码的区别。这个术语被用来最大化恐慌效果。',
        correctAction: '了解基础安全知识：密码哈希≠明文密码，但如果你的密码太简单，确实可能被破解。定期更新密码是好习惯。' },
      { id: 'e006-r5', label: '看似合理的安全建议', severity: 'medium',
        explanation: '邮件中混合了真实的安全建议（修改密码、启用MFA）和钓鱼陷阱（点击链接查看报告）。真假混杂是最难识别的钓鱼手法。',
        correctAction: '安全建议本身是对的，但执行渠道不对。通过官方渠道独立执行，不通过邮件中的链接。' },
      { id: 'e006-r6', label: '引导点击查看"泄露报告"', severity: 'high',
        explanation: '诱导你点击链接查看"完整泄露报告"。这个链接可能导向钓鱼网站，要求你输入当前密码来"检查"是否泄露——从而真正泄露你的密码。',
        correctAction: '不要通过邮件链接查看安全报告。在官方安全平台或通过IT部门查询。' },
      { id: 'e006-r7', label: '红色CTA按钮诱导', severity: 'high',
        explanation: '使用红色按钮配合"查看泄露报告 & 立即防护"的双重承诺，结合恐惧心理，形成强烈的点击冲动。这是将恐惧转化为行动的经典设计。',
        correctAction: '不要因恐惧而仓促行动。恐慌时做的决定往往是最危险的。' },
      { id: 'e006-r8', label: '"系统自动触发"免责话术', severity: 'low',
        explanation: '"系统自动触发"试图让你相信这是来自自动化安全系统的通知，而非人为发送的钓鱼邮件。配合凌晨3点的发送时间，进一步强化"自动化"的印象。',
        correctAction: '发送时间和免责声明都不能作为信任邮件的依据。' }
    ]
  }
];

// ═══════════════════════════════════════════════════════════
//  APPLICATION
// ═══════════════════════════════════════════════════════════

const app = {
  state: {
    view: 'landing',
    queue: [],          // email ids to practice
    currentIdx: 0,      // index in queue
    selected: new Set(), // selected risk point ids for current email
    results: [],         // per-email results
    phase: 'selecting'   // selecting | reviewing
  },

  // ─── Init ───
  init() {
    this.renderLanding();
  },

  // ─── Navigation ───
  switchView(name) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    const el = document.getElementById('view' + name.charAt(0).toUpperCase() + name.slice(1));
    if (el) {
      el.classList.add('active');
      // Re-trigger animation
      el.style.animation = 'none';
      el.offsetHeight;
      el.style.animation = '';
    }
    this.state.view = name;
    this.updateHeader();
  },

  goHome() {
    this.state.queue = [];
    this.state.results = [];
    this.state.currentIdx = 0;
    this.switchView('landing');
  },

  // ─── Header ───
  updateHeader() {
    const { view, queue, currentIdx, results } = this.state;
    const headerProgress = document.getElementById('headerProgress');
    const headerStats = document.getElementById('headerStats');
    const headerScore = document.getElementById('headerScore');
    const headerEmails = document.getElementById('headerEmails');

    if (view === 'practice' && queue.length > 0) {
      headerStats.style.display = 'flex';
      headerProgress.innerHTML = queue.map((_, i) => {
        let cls = 'progress-dot';
        if (i < results.length) cls += results[i].percentage >= 70 ? ' done-correct' : ' done-wrong';
        if (i === currentIdx) cls += ' active';
        return `<div class="${cls}"></div>`;
      }).join('');

      const totalScore = results.reduce((s, r) => s + r.score, 0);
      const totalMax = results.reduce((s, r) => s + r.maxScore, 0);
      headerScore.textContent = totalMax > 0 ? Math.round(totalScore / totalMax * 100) + '%' : '—';
      headerEmails.textContent = `${currentIdx + 1}/${queue.length}`;
    } else {
      headerProgress.innerHTML = '';
      headerStats.style.display = view === 'landing' ? 'none' : 'flex';
    }
  },

  // ─── Landing ───
  renderLanding() {
    const grid = document.getElementById('scenarioGrid');
    const scenarioCounts = {};
    EMAILS.forEach(e => { scenarioCounts[e.scenario] = (scenarioCounts[e.scenario] || 0) + 1; });

    grid.innerHTML = Object.entries(SCENARIOS).map(([key, s]) => {
      const count = scenarioCounts[key] || 0;
      const emails = EMAILS.filter(e => e.scenario === key);
      const avgDiff = emails.length ? (emails.reduce((s, e) => s + e.difficulty, 0) / emails.length).toFixed(1) : 0;
      return `
        <div class="scenario-card" data-scenario="${key}" onclick="app.startScenario('${key}')">
          <div class="scenario-icon">${s.icon}</div>
          <div class="scenario-name">${s.name}</div>
          <div class="scenario-desc">${s.desc}</div>
          <div class="scenario-meta">
            <span><span class="scenario-count">${count}</span> 道题目</span>
            <span>难度 ${avgDiff}/5</span>
          </div>
        </div>`;
    }).join('');

    document.getElementById('headerStats').style.display = 'none';
  },

  // ─── Start Practice ───
  startScenario(key) {
    const ids = EMAILS.filter(e => e.scenario === key).map(e => e.id);
    this.beginPractice(ids);
  },

  startAll() {
    this.beginPractice(EMAILS.map(e => e.id));
  },

  startRandom() {
    const idx = Math.floor(Math.random() * EMAILS.length);
    this.beginPractice([EMAILS[idx].id]);
  },

  beginPractice(queue) {
    this.state.queue = queue;
    this.state.currentIdx = 0;
    this.state.results = [];
    this.state.selected = new Set();
    this.state.phase = 'selecting';
    this.switchView('practice');
    this.renderEmail();
  },

  // ─── Render Email ───
  renderEmail() {
    const { queue, currentIdx } = this.state;
    const emailId = queue[currentIdx];
    const data = EMAILS.find(e => e.id === emailId);
    if (!data) return;

    this.state.selected = new Set();
    this.state.phase = 'selecting';

    // Email content
    const ec = document.getElementById('emailContent');
    const initial = data.email.from.name.charAt(0);
    ec.innerHTML = `
      <div class="email-header">
        <div class="email-subject">${this.escapeHtml(data.email.subject)}</div>
        <div class="email-meta-row">
          <div class="email-avatar">${initial}</div>
          <div class="email-sender-info">
            <div class="email-sender-name">${this.escapeHtml(data.email.from.name)}</div>
            <div class="email-sender-addr">&lt;${this.escapeHtml(data.email.from.email)}&gt;</div>
          </div>
          <div class="email-date">${this.escapeHtml(data.email.date)}</div>
        </div>
        <div class="email-meta-row" style="margin-top:4px">
          <div class="email-meta-label">收件人</div>
          <div class="email-meta-value">${this.escapeHtml(data.email.to)}</div>
        </div>
      </div>
      <div class="email-body">${data.email.body}</div>
      ${data.email.attachments.length ? `
        <div class="email-attachments">
          ${data.email.attachments.map(a => `
            <div class="attachment">
              <span class="icon">📎</span>
              <span>${this.escapeHtml(a.name)}</span>
              <span style="color:var(--text-muted);font-size:11px">${a.size}</span>
            </div>`).join('')}
        </div>` : ''}
      <div class="email-footer">
        <button class="footer-btn">&#8634; 回复</button>
        <button class="footer-btn">&#8594; 转发</button>
        <button class="footer-btn">&#9733; 标记</button>
      </div>`;

    // Bind click events on risk points
    ec.querySelectorAll('.risk-point').forEach(el => {
      el.addEventListener('click', (e) => {
        e.preventDefault();
        if (this.state.phase !== 'selecting') return;
        const rid = el.dataset.riskId;
        if (!rid) return;
        this.toggleRiskPoint(rid, el);
      });
    });

    this.renderSidePanel(data);
    this.updateHeader();

    // Scroll email to top
    document.querySelector('.email-panel').scrollTop = 0;
  },

  toggleRiskPoint(rid, el) {
    const sel = this.state.selected;
    if (sel.has(rid)) {
      sel.delete(rid);
      el.classList.remove('selected');
    } else {
      sel.add(rid);
      el.classList.add('selected');
    }
    this.renderSelectedList();
  },

  renderSelectedList() {
    const data = this.getCurrentEmail();
    if (!data) return;

    const listEl = document.getElementById('selectedList');
    const countEl = document.getElementById('selectedCount');

    if (this.state.phase === 'selecting') {
      countEl.textContent = this.state.selected.size;
      if (this.state.selected.size === 0) {
        listEl.innerHTML = '<div class="empty-hint">尚未标记任何风险点</div>';
      } else {
        listEl.innerHTML = Array.from(this.state.selected).map(rid => {
          const rp = data.riskPoints.find(r => r.id === rid);
          return `<div class="selected-item">
            <span class="dot"></span>
            <span>${this.escapeHtml(rp ? rp.label : rid)}</span>
            <button class="remove" onclick="app.removeSelection('${rid}')" title="取消选择">✕</button>
          </div>`;
        }).join('');
      }
    }
  },

  removeSelection(rid) {
    this.state.selected.delete(rid);
    const el = document.querySelector(`[data-risk-id="${rid}"]`);
    if (el) el.classList.remove('selected');
    this.renderSelectedList();
  },

  // ─── Side Panel ───
  renderSidePanel(data) {
    const panel = document.getElementById('sidePanel');
    panel.innerHTML = `
      <div class="panel-section">
        <div class="email-tags">
          <span class="tag tag-scenario">${SCENARIOS[data.scenario].icon} ${SCENARIOS[data.scenario].name}</span>
          <span class="tag tag-diff">${'●'.repeat(data.difficulty)}${'○'.repeat(5-data.difficulty)} ${DIFFICULTY_LABELS[data.difficulty]}</span>
        </div>
      </div>

      <div class="panel-section">
        <div class="instruction-box">
          <div class="instruction-text">
            <strong>&#128269; 找出这封邮件中的可疑之处</strong><br>
            点击邮件中 <span style="border-bottom:2px dashed var(--red-dim)">鼠标悬停时出现下划线</span> 的文字来标记你认为的风险点。<br>
            <span style="color:var(--text-muted);font-size:12px">提示：仔细阅读邮件，将鼠标移到你觉得可疑的文字上，发现下划线后点击标记。</span><br>
            标记完成后点击「提交答案」查看解析。
          </div>
        </div>
      </div>

      <div class="panel-section" style="flex:1">
        <div class="panel-label">已标记的风险点（<span id="selectedCount">0</span>）</div>
        <div id="selectedList"><div class="empty-hint">尚未标记任何风险点</div></div>
      </div>

      <div class="panel-actions">
        <button class="btn-submit" id="btnSubmit" onclick="app.submitAnswer()">&#10003; 提交答案</button>
        <button class="btn btn-ghost btn-sm btn-skip" onclick="app.skipEmail()">跳过此题</button>
      </div>`;
  },

  // ─── Submit ───
  submitAnswer() {
    const data = this.getCurrentEmail();
    if (!data) return;

    this.state.phase = 'reviewing';
    const selected = this.state.selected;
    const riskPoints = data.riskPoints;

    // Calculate score
    let score = 0;
    let maxScore = 0;
    let hits = 0;
    let misses = 0;
    let falsePositives = 0;

    const results = riskPoints.map(rp => {
      const weight = { low: 1, medium: 2, high: 3, critical: 4 }[rp.severity] || 2;
      maxScore += weight;
      const hit = selected.has(rp.id);
      if (hit) { score += weight; hits++; }
      else { misses++; }
      return { ...rp, hit, weight };
    });

    // Mark false selections (not real risk points) - for future extensibility
    // In v1 all clickable items ARE risk points, so no false positives from clicking

    const percentage = maxScore > 0 ? Math.round(score / maxScore * 100) : 0;

    this.state.results.push({ score, maxScore, percentage, hits, misses, falsePositives });

    // Update email visual state
    const ec = document.getElementById('emailContent');
    ec.querySelectorAll('.risk-point').forEach(el => {
      el.classList.remove('selected');
      const rid = el.dataset.riskId;
      if (selected.has(rid)) {
        el.classList.add('result-correct');
      } else {
        el.classList.add('result-missed');
      }
      el.style.cursor = 'default';
    });

    // Render results panel
    this.renderResultsPanel(data, results, score, maxScore, percentage, hits, misses);
    this.updateHeader();
  },

  renderResultsPanel(data, results, score, maxScore, percentage, hits, misses) {
    const panel = document.getElementById('sidePanel');

    const grade = percentage >= 90 ? 'S' : percentage >= 75 ? 'A' : percentage >= 60 ? 'B' : percentage >= 40 ? 'C' : 'D';
    const gradeClass = grade.toLowerCase();
    const messages = {
      S: '出色！你对钓鱼邮件有极高的敏感度。',
      A: '很好！大部分风险点都被你发现了。',
      B: '不错，但还有遗漏。注意那些隐蔽的手法。',
      C: '需要加强训练，很多风险点没被识别。',
      D: '建议重新学习钓鱼邮件识别课程。'
    };

    panel.innerHTML = `
      <div class="result-score-section">
        <div class="score-circle grade-${gradeClass}">
          <div class="score-num" style="color:var(--grade-${gradeClass})">${percentage}%</div>
          <div class="score-label">得分</div>
        </div>
        <div class="score-grade" style="color:var(--grade-${gradeClass})">评级 ${grade}</div>
        <div class="score-message">${messages[grade]}</div>
      </div>

      <div class="result-stats">
        <div class="result-stat stat-correct">
          <div class="result-stat-num">${hits}</div>
          <div class="result-stat-label">命中</div>
        </div>
        <div class="result-stat stat-missed">
          <div class="result-stat-num">${misses}</div>
          <div class="result-stat-label">遗漏</div>
        </div>
        <div class="result-stat stat-false">
          <div class="result-stat-num">${data.riskPoints.length}</div>
          <div class="result-stat-label">总计</div>
        </div>
      </div>

      <div class="risk-breakdown">
        <div class="panel-label">风险点详细解读</div>
        ${results.map(r => `
          <div class="risk-card">
            <div class="risk-card-header">
              <div class="risk-status ${r.hit ? 'hit' : 'miss'}">${r.hit ? '✓' : '✗'}</div>
              <div class="risk-card-title">${this.escapeHtml(r.label)}</div>
            </div>
            <div class="risk-explanation">
              <div class="risk-explanation-label">为什么危险</div>
              <div class="risk-explanation-text">${this.escapeHtml(r.explanation)}</div>
            </div>
            <div class="risk-explanation correct-action">
              <div class="risk-explanation-label">正确做法</div>
              <div class="risk-explanation-text">${this.escapeHtml(r.correctAction)}</div>
            </div>
          </div>
        `).join('')}
      </div>

      <div class="panel-actions">
        <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="app.nextEmail()">
          ${this.state.currentIdx < this.state.queue.length - 1 ? '下一封邮件 →' : '查看训练报告'}
        </button>
        <button class="btn btn-ghost btn-sm" style="width:100%;justify-content:center" onclick="app.goHome()">返回首页</button>
      </div>`;
  },

  // ─── Navigation ───
  skipEmail() {
    const data = this.getCurrentEmail();
    if (!data) return;
    this.state.results.push({
      score: 0,
      maxScore: data.riskPoints.length * 2,
      percentage: 0,
      hits: 0,
      misses: data.riskPoints.length,
      falsePositives: 0,
      skipped: true
    });
    this.nextEmail();
  },

  nextEmail() {
    this.state.currentIdx++;
    if (this.state.currentIdx >= this.state.queue.length) {
      this.showComplete();
    } else {
      this.state.selected = new Set();
      this.state.phase = 'selecting';
      this.renderEmail();
    }
  },

  // ─── Complete ───
  showComplete() {
    const { results } = this.state;
    const totalScore = results.reduce((s, r) => s + r.score, 0);
    const totalMax = results.reduce((s, r) => s + r.maxScore, 0);
    const overallPct = totalMax > 0 ? Math.round(totalScore / totalMax * 100) : 0;
    const totalHits = results.reduce((s, r) => s + r.hits, 0);
    const totalMisses = results.reduce((s, r) => s + r.misses, 0);

    const grade = overallPct >= 90 ? 'S' : overallPct >= 75 ? 'A' : overallPct >= 60 ? 'B' : overallPct >= 40 ? 'C' : 'D';

    document.getElementById('completeContent').innerHTML = `
      <div class="complete-icon">✓</div>
      <h2 class="complete-title">训练完成</h2>
      <p class="complete-subtitle">
        你已完成 ${results.length} 封邮件的找茬训练。<br>
        继续练习可以提升你对钓鱼邮件的识别敏感度。
      </p>

      <div class="final-stats">
        <div class="final-stat">
          <div class="final-stat-num">${overallPct}%</div>
          <div class="final-stat-label">总正确率</div>
        </div>
        <div class="final-stat">
          <div class="final-stat-num" style="color:var(--green)">${totalHits}</div>
          <div class="final-stat-label">命中风险点</div>
        </div>
        <div class="final-stat">
          <div class="final-stat-num" style="color:var(--red)">${totalMisses}</div>
          <div class="final-stat-label">遗漏风险点</div>
        </div>
      </div>

      <div class="landing-actions">
        <button class="btn btn-primary" onclick="app.startAll()">再来一轮</button>
        <button class="btn btn-ghost" onclick="app.goHome()">返回首页</button>
      </div>`;

    this.switchView('complete');
  },

  // ─── Helpers ───
  getCurrentEmail() {
    const emailId = this.state.queue[this.state.currentIdx];
    return EMAILS.find(e => e.id === emailId);
  },

  escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
};

// Boot
document.addEventListener('DOMContentLoaded', () => app.init());
</script>
</body>
</html>
